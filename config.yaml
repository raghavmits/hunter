# Tunable numbers for Hunter. Changing a quota or a cadence interval is a text
# edit here, not a migration or a code change (PLAN.md FR-2).

cadence:
  cold_outreach:
    intervals: [5, 10, 20]
  warm_intro_request:
    intervals: [3, 6, 12]
  referral_promised:
    intervals: [2, 5, 10]
  post_recruiter_call:
    intervals: [3, 6, 12]
  post_interview:
    intervals: [3, 7, 12]
  application_submitted:
    intervals: [7, 14]
